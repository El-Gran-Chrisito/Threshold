# Cloudflare Workers settings for the license server.
# Secrets are set with: wrangler secret put STRIPE_SECRET_KEY / LICENSE_PRIVATE_KEY
name = "threshold-license"
main = "worker.ts"
compatibility_date = "2026-09-01"

[vars]
# Stripe price ids to plans, if the prices have no "plan" metadata:
# PRICE_PLANS = '{"price_123":"pro","price_456":"studio"}'
# ALLOWED_ORIGIN = "https://your-site.example"
# Emailing keys to buyers (also run: wrangler secret put RESEND_API_KEY):
# EMAIL_FROM = "Threshold <keys@your-site.example>"
# SUPPORT_EMAIL = "support@your-site.example"
# Design assistant for paying customers (also run: wrangler secret put ANTHROPIC_API_KEY):
# ASSISTANT_MODEL = "claude-sonnet-5"
# ASSISTANT_DAILY_LIMIT = "60"
# TRIAL_ASSISTANT_DAILY_LIMIT = "10"
# Invite credit per paid friend, in cents (default: one month of the inviter's plan):
# REFERRAL_CREDIT_CENTS = "1200"
# Tips list download (POST /leads): wrangler secret put ADMIN_TOKEN

# Design sync for paying customers (optional). Create the namespace with
#   npx wrangler kv namespace create DESIGNS
# and paste its id here.
# [[kv_namespaces]]
# binding = "DESIGNS"
# id = "<namespace id>"
